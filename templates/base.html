<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
{% if canonical %}
  <link rel="canonical" href="{{ canonical }}">
{% endif %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232F6DB5'/%3E%3Crect x='3' y='8' width='2' height='5' fill='white'/%3E%3Crect x='7' y='5' width='2' height='8' fill='white'/%3E%3Crect x='11' y='3' width='2' height='10' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-data-base="/data/">
  <header class="sitebar">
    <div class="sitebar-inner">
      <a class="sitename" href="/">Persian Gulf Daily Summary</a>
      <nav class="sitenav" aria-label="Site">
        <a href="/"{% if active == "latest" %} aria-current="page"{% endif %}>Latest</a>
        <a href="/archive/"{% if active == "archive" %} aria-current="page"{% endif %}>Archive</a>
        <a href="/charts/"{% if active == "charts" %} aria-current="page"{% endif %}>Charts</a>
      </nav>
    </div>
  </header>

  <main class="content">
{% block content %}{% endblock %}
  </main>

  <footer class="footer">
    {% block footer %}<a href="/archive/">Archive</a>{% endblock %}
  </footer>
{% block scripts %}{% endblock %}
</body>
</html>
