# Validate summaries and chart data on every push and pull request.
# Publishing itself is done by Cloudflare's Git integration (see README).
name: Check site data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - run: python -m unittest discover -s tests -v
